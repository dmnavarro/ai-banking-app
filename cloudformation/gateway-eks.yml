AWSTemplateFormatVersion: 2010-09-09
Description: >
  DG Bank — EKS cluster for TrendAI AI Gateway.
  Runs in the VPC created by the ECS stack (cloudformation/ecs.yml) so the
  DG Bank app can reach the gateway over a private address. The gateway itself
  is installed afterwards with the Helm command generated by the Vision One console.

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC created by the ECS stack (deploy-gateway.sh looks this up)

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The ECS stack's two public subnets (one per AZ)

  ClusterName:
    Type: String
    Default: dgbank-ai-gateway
    Description: EKS cluster name

  KubernetesVersion:
    Type: String
    Default: ""
    Description: EKS Kubernetes version (e.g. 1.34). Leave empty for the current EKS default.

  NodeInstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m6i.large, m6i.xlarge, m7i.large]
    Description: EC2 instance type for the gateway node (2 vCPU / 8 GB is the starting size)

  NodeCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 3
    Description: Number of worker nodes

  PublicAccessCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "CIDR allowed to reach the Kubernetes API (kubectl/helm), e.g. 1.2.3.4/32. Run: curl ifconfig.me"

  LoadBalancerControllerPolicyArn:
    Type: String
    Description: IAM policy for the AWS Load Balancer Controller (deploy-gateway.sh creates it)


Conditions:
  HasKubernetesVersion: !Not [!Equals [!Ref KubernetesVersion, ""]]

Resources:

  # ---------------------------------------------------------------------------
  # IAM — EKS cluster role
  # ---------------------------------------------------------------------------
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # ---------------------------------------------------------------------------
  # IAM — Node role (kubelet, VPC CNI, ECR pull, SSM)
  # ---------------------------------------------------------------------------
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # ---------------------------------------------------------------------------
  # IAM — AWS Load Balancer Controller (via EKS Pod Identity)
  # ---------------------------------------------------------------------------
  LoadBalancerControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-lbc-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - !Ref LoadBalancerControllerPolicyArn

  # ---------------------------------------------------------------------------
  # IAM — Amazon EBS CSI driver (via EKS Pod Identity)
  # Creates the EBS volumes behind PersistentVolumeClaims, e.g. the gateway's Redis
  # ---------------------------------------------------------------------------
  EBSCSIDriverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-ebs-csi-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

  # ---------------------------------------------------------------------------
  # EKS cluster
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !If [HasKubernetesVersion, !Ref KubernetesVersion, !Ref AWS::NoValue]
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true   # the identity running the deploy gets cluster admin
      ResourcesVpcConfig:
        SubnetIds: !Ref SubnetIds
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs:
          - !Ref PublicAccessCidr
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
      Tags:
        - Key: Name
          Value: !Ref ClusterName

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref Cluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  LoadBalancerControllerPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref Cluster
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: !GetAtt LoadBalancerControllerRole.Arn

  EBSCSIDriverPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref Cluster
      Namespace: kube-system
      ServiceAccount: ebs-csi-controller-sa
      RoleArn: !GetAtt EBSCSIDriverRole.Arn

  # ---------------------------------------------------------------------------
  # Node group — launch template enforces IMDSv2 (same as the ECS instances)
  # ---------------------------------------------------------------------------
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ClusterName}-node"
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required            # IMDSv2 only
          HttpPutResponseHopLimit: 1      # pods can't reach IMDS; AWS access goes through Pod Identity
        CreditSpecification:
          CpuCredits: unlimited           # t3: never throttled when burst credits run out
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ClusterName}-node"

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: !Sub "${ClusterName}-nodes"
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: !Ref SubnetIds
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes:
        - !Ref NodeInstanceType
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
      ScalingConfig:
        MinSize: !Ref NodeCount
        DesiredSize: !Ref NodeCount
        MaxSize: !Ref NodeCount
      UpdateConfig:
        MaxUnavailable: 1
      Labels:
        workload: ai-gateway

Outputs:

  ClusterName:
    Description: EKS cluster name
    Value: !Ref Cluster

  ClusterEndpoint:
    Description: Kubernetes API endpoint
    Value: !GetAtt Cluster.Endpoint

  ClusterSecurityGroupId:
    Description: Security group EKS attaches to the control plane and nodes
    Value: !GetAtt Cluster.ClusterSecurityGroupId

  NodeRoleArn:
    Description: IAM role for the worker nodes
    Value: !GetAtt NodeRole.Arn

  VpcId:
    Description: VPC the cluster runs in (shared with the ECS stack)
    Value: !Ref VpcId
